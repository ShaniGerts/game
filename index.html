<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Демо игра</title>

<style>

body {
  background: #0f1e17;
  color: #e8f2ec;
  font-family: sans-serif;
  margin: 0;
}

.screen {
  display: none;
  padding: 20px;
  opacity: 0;
  transform: translateY(20px) scale(0.98);
  transition: all 0.6s ease;
}

.screen.active {
  display: block;
  opacity: 1;
  transform: translateY(0) scale(1);
}

button {
  background: #2e5e4e;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 10px;
  margin-top: 15px;
}

.content-img {
  width: 100%;
  max-width: 340px;
  margin: 15px auto;
  display: block;
  border-radius: 15px;
}

.map {
  position: relative;
  max-width: 340px;
  margin: 20px auto;
}

.map-img {
  width: 100%;
  border-radius: 20px;
}

.zone {
  position: absolute;
  width: 50%;
  height: 50%;
}

.zone1 { top: 0; left: 0; }
.zone2 { top: 0; right: 0; }
.zone3 { bottom: 0; left: 0; }
.zone4 { bottom: 0; right: 0; }

.zone.selected {
  background: rgba(255,255,255,0.15);
  border-radius: 20px;
}

.overlay {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.6);
  opacity:0;
  pointer-events:none;
  transition:0.5s;
}

.overlay.active {
  opacity:1;
  pointer-events:auto;
}

.insight-input {
  width: 100%;
  max-width: 340px;
  margin-top: 15px;
  border-radius: 12px;
  padding: 12px;
  border: none;
  background: #1c2f27;
  color: #e8f2ec;
}

.fade-text {
  opacity: 0;
  transition: opacity 1s ease;
}

.fade-text.show {
  opacity: 1;
}

.zoomed {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:contain;
  background:black;
  z-index:1000;
}

</style>
</head>

<body>

<div id="overlay" class="overlay"></div>

<!-- экран 1 -->
<div class="screen active" id="screen1">
  <h2>Добро пожаловать</h2>
  <img src="welcome.jpg" class="content-img">
  <button onclick="nextScreen(2)">Далее</button>
</div>

<!-- экран 2 -->
<div class="screen" id="screen2">
  <h2>Правила</h2>
  <img src="rules.jpg" id="rulesImg" class="content-img">
  <button onclick="nextScreen(3)">Далее</button>
</div>

<!-- экран 3 -->
<div class="screen" id="screen3">
  <h2>Подготовка</h2>

  <button onclick="playPrep('prep1')">Подготовка 1</button>
  <button onclick="playPrep('prep2')">Подготовка 2</button>

  <button onclick="nextScreen(4)">Далее</button>
</div>

<!-- экран 4 (карта) -->
<div class="screen" id="screen4">
  <h2>Выбери путь</h2>

  <div class="map">
    <img src="map.jpg" class="map-img">

    <div class="zone zone1" onclick="cellClick(1)"></div>
    <div class="zone zone2" onclick="cellClick(2)"></div>
    <div class="zone zone3" onclick="cellClick(3)"></div>
    <div class="zone zone4" onclick="cellClick(4)"></div>
  </div>

  <div id="resultBlock" style="display:none; text-align:center;">
    <p id="resultText" class="fade-text"></p>

    <textarea placeholder="Запиши свои мысли..." class="insight-input"></textarea>

    <button onclick="nextScreen(5)">Продолжить</button>
  </div>
</div>

<!-- экран 5 -->
<div class="screen" id="screen5">
  <h2>Завершение</h2>

  <p class="fade-text show">
    Ты прошла этот путь не случайно. Обрати внимание на свои ощущения.
  </p>

  <textarea placeholder="Что было самым важным?" class="insight-input"></textarea>

  <button>Получить полную версию</button>
</div>

<!-- аудио -->
<audio id="prep1" src="prep1.mp3"></audio>
<audio id="prep2" src="prep2.mp3"></audio>

<audio id="cell1" src="1.mp3"></audio>
<audio id="cell2" src="2.mp3"></audio>
<audio id="cell3" src="3.mp3"></audio>
<audio id="cell4" src="4.mp3"></audio>

<script>

function nextScreen(n) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen' + n).classList.add('active');

  document.getElementById("overlay").classList.remove("active");

  document.querySelectorAll("audio").forEach(a => {
    a.pause();
    a.currentTime = 0;
  });

  currentAudio = null;
  prepAudio = null;

  if (n === 5) {
    document.body.style.background = "#0a1511";
  }
}

let prepAudio = null;

function playPrep(id) {
  let audio = document.getElementById(id);

  if (prepAudio && prepAudio !== audio) {
    prepAudio.pause();
    prepAudio.currentTime = 0;
  }

  if (prepAudio === audio && !audio.paused) {
    audio.pause();
    return;
  }

  prepAudio = audio;
  audio.play();
}

let currentAudio = null;

function cellClick(n) {
  let audio = document.getElementById('cell' + n);

  if (currentAudio && currentAudio !== audio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }

  if (currentAudio === audio && !audio.paused) {
    audio.pause();
    document.getElementById("overlay").classList.remove("active");
    return;
  }

  currentAudio = audio;
  audio.play();

  document.getElementById("overlay").classList.add("active");

  document.querySelectorAll('.zone').forEach(z => z.classList.remove("selected"));
  document.querySelectorAll('.zone')[n - 1].classList.add("selected");

  let texts = {
    1: "Ты выбрала путь силы рода.",
    2: "Тебя ведёт энергия дома.",
    3: "Ты стоишь перед выбором.",
    4: "Ты идёшь к вершине."
  };

  let textEl = document.getElementById("resultText");
  textEl.innerText = texts[n];
  document.getElementById("resultBlock").style.display = "block";

  textEl.classList.remove("show");
  setTimeout(() => textEl.classList.add("show"), 100);

  audio.onended = () => {
    document.getElementById("overlay").classList.remove("active");
  };
}

document.getElementById("overlay").onclick = function() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    this.classList.remove("active");
  }
};

document.getElementById("rulesImg").onclick = function() {
  this.classList.toggle("zoomed");
};

</script>

</body>
</html>
