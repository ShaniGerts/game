<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Жить = Творить Демо-игра</title>

<style>
body {
  font-family: -apple-system, sans-serif;
  text-align: center;
  background: linear-gradient(180deg, #0f0f1f, #1a1a2e);
  color: white;
  margin: 0;
}
  .map {
  position: relative;
  max-width: 340px;
  margin: 30px auto;
}

.map-img {
  width: 100%;
  border-radius: 20px;
  animation: glow 3s infinite alternate;
}

.zone {
  position: absolute;
  width: 50%;
  height: 50%;
}

.zone1 { top: 0; left: 0; }
.zone2 { top: 0; right: 0; }
.zone3 { bottom: 0; left: 0; }
.zone4 { bottom: 0; right: 0; }

.zone:active {
  background: rgba(255,255,255,0.2);
  border-radius: 20px;
}
.screen {
  display: none;
  padding: 20px;
  animation: fade 0.5s;
}

.active {
  display: block;
}

@keyframes fade {
  from {opacity: 0;}
  to {opacity: 1;}
}

button {
  padding: 15px 25px;
  font-size: 16px;
  margin-top: 20px;
  border-radius: 12px;
  border: none;
  background: #6c5ce7;
  color: white;
}

.card {
  background: rgba(255,255,255,0.05);
  padding: 20px;
  border-radius: 20px;
  margin-top: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  max-width: 320px;
  margin: 30px auto;
}

.cell {
  height: 140px;
  border-radius: 20px;
  background: linear-gradient(135deg, #6c5ce7, #a29bfe);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  cursor: pointer;
  transition: 0.3s;
}

.cell:active {
  transform: scale(0.95);
}
  .zoomed {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
  z-index: 1000;
}
  @keyframes glow {
  from { filter: brightness(1); }
  to { filter: brightness(1.15); }
}
</style>
</head>

<body>

<div class="screen active" id="screen1">
  <div class="card">
    <h2>Добро пожаловать</h2>
    <img src="hello.jpg" 
     style="width:100%; border-radius:15px; margin-top:15px;">
    <button onclick="playAudio('audio1')">▶️ Слушать</button><br>
    <button onclick="nextScreen(2)">Далее</button>
  </div>
</div>

<div class="screen" id="screen2">
  <div class="card">
    <h2>Правила</h2>
   <img src="rules.jpg" 
     id="rulesImg"
     style="width:100%; border-radius:15px;">
    <button onclick="nextScreen(3)">Далее</button>
  </div>
</div>

<div class="screen" id="screen3">
  <div class="card">
    <h2>Подготовка</h2>
    <button onclick="playAudio('audio2')">Этап 1</button><br>
    <button onclick="playAudio('audio3')">Этап 2</button><br>
    <button onclick="nextScreen(5)">К игре</button>
  </div>
</div>

<div class="screen" id="screen5">
  <h2>Пройди поочередно каждую из четырех локаций</h2>

  <div class="map">
  <img src="IMG_9728.PNG" class="map-img">
    
 <div class="zone zone1" onclick="cellClick(1)"></div>
  <div class="zone zone2" onclick="cellClick(2)"></div>
  <div class="zone zone3" onclick="cellClick(3)"></div>
  <div class="zone zone4" onclick="cellClick(4)"></div>
</div>
  
  <button onclick="nextScreen(6)">Завершить</button>
</div>

<div class="screen" id="screen6">
  <div class="card">
    <h2>Заключение</h2>
    <button onclick="playAudio('audio4')">Слушать</button>
  </div>
</div>

<audio id="audio1" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
<audio id="audio2" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"></audio>
<audio id="audio3" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"></audio>
<audio id="audio4" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"></audio>

<audio id="cell1" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"></audio>
<audio id="cell2" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3"></audio>
<audio id="cell3" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3"></audio>
<audio id="cell4" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"></audio>

<script>
function nextScreen(n) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen' + n).classList.add('active');
}

function playAudio(id) {
  document.getElementById(id).play();
}

let selected = false;

function cellClick(n) {
  if (selected) return;
  selected = true;

  document.getElementById('cell' + n).play();

  document.querySelectorAll('.zone').forEach((z, i) => {
    if (i !== n - 1) {
      z.style.opacity = "0.3";
    } else {
      z.style.background = "rgba(255,255,255,0.25)";
    }
  });
}
  document.getElementById("rulesImg").onclick = function() {
  this.classList.toggle("zoomed");
};
</script>

</body>
</html>
